<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
    <link rel="icon" type="image" href="static/dee.png">
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <div class="ai-animation">
          <div class="neural-network">
            <div class="node-layer">
              <div class="node"></div>
              <div class="node"></div>
              <div class="node"></div>
            </div>
            <div class="node-layer">
              <div class="node"></div>
              <div class="node"></div>
              <div class="node"></div>
              <div class="node"></div>
            </div>
            <div class="node-layer">
              <div class="node"></div>
              <div class="node"></div>
              <div class="node"></div>
            </div>
          </div>
          <svg class="connections" xmlns="http://www.w3.org/2000/svg">
            <line class="connection-line" x1="0" y1="0" x2="0" y2="0"></line>
          </svg>
        </div>
        <div class="loading-text">
          <h2 class="loading-title">Loading Portfolio</h2>
          <p class="loading-subtitle">Fetching data from the cloud...</p>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="data-stats">
            <span class="stat"><span class="stat-icon">📊</span> Analyzing data...</span>
            <span class="stat"><span class="stat-icon">🤖</span> Training models...</span>
            <span class="stat"><span class="stat-icon">🚀</span> Optimizing performance...</span>
          </div>
        </div>
        <button id="skipLoader" class="skip-btn" style="display: none;">
          Skip <span class="skip-icon">→</span>
        </button>
      </div>
    </div>

    <div class="page">
        <main class="main">
          <section id="hero" class="hero-card">
            <!-- Content will be populated by JS -->
          </section>

          <section id="profileSection">
            <div id="profile">
              <div class="profile-text">
                <p class="intro-greeting">Hi, I'm <strong>Deepak Yadav</strong> 👋</p>
                <div id="summary"></div>
              </div>
              <div id="socialLink"></div>
            </div>
          </section>

            <section id="workExperienceSection">
  <div class="section-head">
    <h2>Work Experience</h2>
    <div class="section-line"></div>
  </div>
  <div id="workExperience"></div>
</section>

<section id="projectsSection">
  <div class="section-head">
    <h2>Projects</h2>
    <div class="section-line"></div>
  </div>
  <div id="projects"></div>
</section>

<section id="certificatesSection">
  <div class="section-head">
    <h2>Certificates</h2>
    <div class="section-line"></div>
  </div>
  <div id="certificates"></div>
</section>

<section id="skillsSection">
  <div class="section-head">
    <h2>Skills</h2>
    <div class="section-line"></div>
  </div>
  <div id="skills"></div>
</section>

<section id="educationSection">
  <div class="section-head">
    <h2>Education</h2>
    <div class="section-line"></div>
  </div>
  <div id="education"></div>
</section>

<section id="positionsOfResponsibilitySection">
  <div class="section-head">
    <h2>Positions of Responsibility</h2>
    <div class="section-line"></div>
  </div>
  <div id="positionsOfResponsibility"></div>
</section>
<section id="contact">
  <div class="section-head">
    <h2>Contact</h2>
    <div class="section-line"></div>
  </div>
              <form class="contact-form">
                <div class="form-row">
                  <input type="text" name="name" placeholder="Your Name" required>
                  <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn">Send Message</button>
              </form>
            </section>
       </main>
    </div>
    <header class="bottom-nav">
  <div class="bottom-nav__bar">
    <div class="bottom-nav__links">
      <a href="#profileSection" class="nav-pill" title="Home">
        <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.296.0/icons/home.svg" alt="Home">
        <span>Home</span>
      </a>
      <a href="#workExperienceSection" class="nav-pill" title="Experience">
        <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.296.0/icons/briefcase.svg" alt="Work">
        <span>Work</span>
      </a>
      <a href="#projectsSection" class="nav-pill" title="Projects">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg" alt="Projects">
        <span>Projects</span>
      </a>
      <a href="#skillsSection" class="nav-pill" title="Skills">
        <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.296.0/icons/code.svg" alt="Skills">
        <span>Skills</span>
      </a>
      <a href="#educationSection" class="nav-pill" title="Education">
        <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.296.0/icons/graduation-cap.svg" alt="Education">
        <span>Education</span>
      </a>
      <a href="#certificatesSection" class="nav-pill" title="Certificates">
        <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.296.0/icons/award.svg" alt="Certificates">
        <span>Certs</span>
      </a>
    </div>
    <a class="nav-cta" href="#contact" title="Contact">Let's Connect</a>
  </div>
</header>
<script src="app.js"></script>
</body>
</html>
